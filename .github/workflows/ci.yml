name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Unit and integration tests
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~WorriorVex.UITests"

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/WorriorVex.UITests --configuration Release
      - name: Install Chromium
        run: pwsh tests/WorriorVex.UITests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test tests/WorriorVex.UITests --no-build --configuration Release

  editor-bundle:
    name: Editor bundle builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WorriorVex.UI/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
